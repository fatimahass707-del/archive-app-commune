version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: archive_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: archive_jamaa
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Initialize the database with our schema
      - ./backend/database.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: archive_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=root
      - DB_NAME=archive_jamaa
      - DB_PORT=3307
      - JWT_SECRET=super_secret_key_123
      - REFRESH_TOKEN_SECRET=super_secret_refresh_key_456
      - PORT=5000
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: archive_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
